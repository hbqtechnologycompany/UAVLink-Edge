[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim8262-driver"
version = "0.1.0"
description = "Userspace communication driver for SIMCom SIM8262-E 5G module"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
sim8262 = "sim8262.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sim8262*"]
